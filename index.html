<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steps - See the Working Out</title>
    <meta name="theme-color" content="#FF5722">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" id="pwa-manifest">

    <style>
        :root {
            --primary: #FF5722;
            --bg: #fafafa;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --accent: #2196F3;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            box-sizing: border-box;
            margin-top: 10px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 32px;
            margin: 0;
            color: var(--primary);
            font-weight: 800;
            letter-spacing: -1px;
        }
        .subtitle {
            font-size: 14px;
            color: #666;
            margin: 4px 0 0 0;
            font-weight: 500;
        }
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            background: #f0f0f0;
            padding: 4px;
            border-radius: 10px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 700;
            border-radius: 7px;
            font-size: 14px;
            color: #555;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #444;
        }
        input, select {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            background: #fcfcfc;
            transition: border-color 0.2s ease;
        }
        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
            background: #fff;
        }
        button.calc-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(255, 87, 34, 0.2);
            transition: transform 0.1s ease;
        }
        button.calc-btn:active {
            transform: scale(0.98);
        }
        .output {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #eee;
        }
        .output h3 {
            margin-top: 0;
            font-size: 18px;
            color: #333;
        }
        .step-box {
            background: #f4f9ff;
            border-left: 4px solid var(--accent);
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.5;
        }
        .math-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            line-height: 1.4;
            margin: 16px 0;
            white-space: pre;
            background: #1e1e1e;
            color: #ffffff;
            padding: 18px;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
        }
        .panel { display: none; }
        .panel.active { display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <h1>Steps</h1>
        <p class="subtitle">See the Working Out</p>
    </div>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('column')">Column</button>
        <button class="tab-btn" onclick="switchTab('bus')">Bus Stop</button>
        <button class="tab-btn" onclick="switchTab('bodmas')">BODMAS</button>
    </div>

    <!-- COLUMN METHOD PANEL -->
    <div id="column-panel" class="panel active">
        <div class="input-group">
            <label for="col-num1">First Number:</label>
            <input type="number" id="col-num1" value="348">
        </div>
        <div class="input-group">
            <label for="col-op">Operation:</label>
            <select id="col-op">
                <option value="+">Addition (+)</option>
                <option value="-">Subtraction (-)</option>
            </select>
        </div>
        <div class="input-group">
            <label for="col-num2">Second Number:</label>
            <input type="number" id="col-num2" value="175">
        </div>
        <button class="calc-btn" onclick="calcColumn()">Show Steps</button>
    </div>

    <!-- BUS STOP PANEL -->
    <div id="bus-panel" class="panel">
        <div class="input-group">
            <label for="bus-dividend">Number to divide (inside house):</label>
            <input type="number" id="bus-dividend" value="432">
        </div>
        <div class="input-group">
            <label for="bus-divisor">Divide by (outside house):</label>
            <input type="number" id="bus-divisor" value="3">
        </div>
        <button class="calc-btn" onclick="calcBusStop()">Show Steps</button>
    </div>

    <!-- BODMAS PANEL -->
    <div id="bodmas-panel" class="panel">
        <div class="input-group">
            <label for="bodmas-expr">Sum (e.g., 12 + (8 - 3) * 4):</label>
            <input type="text" id="bodmas-expr" value="12 + (8 - 3) * 4">
        </div>
        <button class="calc-btn" onclick="calcBodmas()">Show Steps</button>
    </div>

    <!-- EXPLANATION OUTPUT -->
    <div id="explanation-output" class="output" style="display:none;">
        <h3>Working Out:</h3>
        <div id="math-visual" class="math-display"></div>
        <div id="steps-container"></div>
    </div>
</div>

<script>
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById('explanation-output').style.display = 'none';
        
        event.target.classList.add('active');
        document.getElementById(`${tab}-panel`).classList.add('active');
    }

    function calcColumn() {
        const n1 = parseInt(document.getElementById('col-num1').value);
        const n2 = parseInt(document.getElementById('col-num2').value);
        const op = document.getElementById('col-op').value;
        
        if(isNaN(n1) || isNaN(n2)) return;

        const s1 = n1.toString();
        const s2 = n2.toString();
        const maxLen = Math.max(s1.length, s2.length);
        
        const pad1 = s1.padStart(maxLen, ' ');
        const pad2 = s2.padStart(maxLen, ' ');
        
        let ans = op === '+' ? n1 + n2 : n1 - n2;
        let ansStr = ans.toString().padStart(maxLen + 2, ' ');
        
        let visual = `  ${pad1}\n${op} ${pad2}\n${'-'.repeat(maxLen + 2)}\n${ansStr}`;
        
        let stepsHtml = ``;
        if (op === '+') {
            stepsHtml += `<div class="step-box">Line up the place values (Hundreds, Tens, Units) neatly in vertical columns.</div>`;
            stepsHtml += `<div class="step-box">Add the numbers column by column, starting from the **right side** (units column).</div>`;
            if (n1 % 10 + n2 % 10 >= 10) {
                stepsHtml += `<div class="step-box">If a column adds up to 10 or more, write the units digit down and **carry over** the tens digit to the next column on the left.</div>`;
            }
        } else {
            stepsHtml += `<div class="step-box">Line up the place values. Top number minus bottom number.</div>`;
            stepsHtml += `<div class="step-box">Work from right to left. If the top digit is smaller than the bottom digit, **borrow 1** from the column directly to the left.</div>`;
        }

        renderResult(visual, stepsHtml);
    }

    function calcBusStop() {
        const dividend = parseInt(document.getElementById('bus-dividend').value);
        const divisor = parseInt(document.getElementById('bus-divisor').value);
        
        if (isNaN(dividend) || !divisor) return;

        const divStr = dividend.toString();
        let currentRem = 0;
        let answerStr = "";
        let stepsHtml = ``;

        for (let i = 0; i < divStr.length; i++) {
            let digit = parseInt(divStr[i]);
            let currentVal = currentRem * 10 + digit;
            let fits = Math.floor(currentVal / divisor);
            let nextRem = currentVal % divisor;
            
            stepsHtml += `<div class="step-box">Look at **${currentVal}**. How many times does ${divisor} fit into it? It goes in **${fits}** times with a remainder of **${nextRem}**.</div>`;
            
            answerStr += fits;
            currentRem = nextRem;
        }

        const finalAns = parseInt(answerStr);

let visual = `   \({finalAns}\n\){divisor} ┌\({'-'.repeat(divStr.length + 2)}\n\){divStr}`;

if (currentRem > 0) {
    visual += `  (Remainder \${currentRem})`;
}

renderResult(visual, stepsHtml);

function calcBodmas() {
    let expr = document.getElementById('bodmas-expr').value;
    let stepsHtml = ``;

    try {
        let safeExpr = expr.replace(/[^0-9+\-*/().\s]/g, '');

        stepsHtml += `<div class="step-box">Follow the rules of **BODMAS**: **B**rackets first, then **O**rders (powers), then **D**ivision and **M**ultiplication, and finally **A**ddition and **S**ubtraction.</div>`;

        if (safeExpr.includes('(')) {
            stepsHtml += `<div class="step-box">1. Break open the **Brackets ()** and solve what is inside them first.</div>`;
        }

        let finalAns = Function('"use strict"; return (' + safeExpr + ')')();

        stepsHtml += `<div class="step-box">2. Calculate any multiplication (*) or division (/) steps moving from left to right.</div>`;
        stepsHtml += `<div class="step-box">3. Complete the remaining addition (+) or subtraction (-) steps.</div>`;
        stepsHtml += `<div class="step-box"><strong>Final Answer: ${finalAns}</strong></div>`;

        renderResult(expr + " = " + finalAns, stepsHtml);
    } catch (e) {
        renderResult("Error", `<div class="step-box">Make sure your expression only uses standard characters like numbers, +, -, *, /, and brackets ().</div>`);
    }
}

function renderResult(visual, steps) {
    document.getElementById('math-visual').innerText = visual;
    document.getElementById('steps-container').innerHTML = steps;
    document.getElementById('explanation-output').style.display = 'block';
}

// Dynamic Manifest Injection with new calculator icon setup
const manifest = {
    "short_name": "Steps",
    "name": "Steps - See the Working Out",
    "start_url": ".",
    "display": "standalone",
    "background_color": "#fafafa",
    "theme-color": "#FF5722",
    "icons": [{
        "src": "https://flaticon.com",
        "type": "image/png",
        "sizes": "512x512",
        "purpose": "any maskable"
    }]
};

const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
document.getElementById('pwa-manifest').setAttribute('href', URL.createObjectURL(manifestBlob));

if ('serviceWorker' in navigator) {
    const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting()); 
        self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.log(err));
}
