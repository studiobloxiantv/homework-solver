<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Steps - Visual Calculator</title>
    <meta name="theme-color" content="#1e1e24">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" id="pwa-manifest">

    <style>
        :root {
            --bg: #000000;
            --calc-bg: #1c1c1e;
            --display-text: #ffffff;
            --btn-num: #3a3a3c;
            --btn-op: #ff9f0a;
            --btn-fn: #a5a5a5;
            --btn-text-dark: #000000;
            --btn-text-light: #ffffff;
            --working-bg: #2c2c2e;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--display-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background: #111;
        }

        .calc-container {
            width: 100vw;
            height: 100vh;
            max-width: 440px;
            max-height: 900px;
            background-color: var(--calc-bg);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 30px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }

        .display-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .input-history {
            font-size: 42px;
            color: #fff;
            min-height: 55px;
            margin-bottom: 5px;
            font-weight: 300;
            text-align: right;
            width: 100%;
            word-wrap: break-word;
            word-break: break-all;
        }

        .working-display {
            width: 100%;
            background: var(--working-bg);
            border-radius: 16px;
            padding: 15px;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            line-height: 1.4;
            white-space: pre;
            color: #2ed573;
            overflow-x: auto;
            margin-bottom: 15px;
            display: none;
            text-align: left;
            border: 1px solid #444;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 10px;
            width: 100%;
        }

        button {
            border: none;
            border-radius: 50%;
            aspect-ratio: 1;
            font-size: 32px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.1s ease, transform 0.05s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        button:active {
            transform: scale(0.92);
            filter: brightness(1.3);
        }

        .btn-number {
            background-color: var(--btn-num);
            color: var(--btn-text-light);
        }

        .btn-operator {
            background-color: var(--btn-op);
            color: var(--btn-text-light);
            font-size: 36px;
        }

        .btn-function {
            background-color: var(--btn-fn);
            color: var(--btn-text-dark);
            font-size: 26px;
            font-weight: 600;
        }

        .btn-zero {
            grid-column: span 2;
            border-radius: 40px;
            aspect-ratio: auto;
            height: 100%;
            justify-content: flex-start;
            padding-left: 32px;
        }
    </style>
</head>
<body>

<div class="calc-container">
    <!-- Display Screen -->
    <div class="display-screen">
        <div id="working-area" class="working-display"></div>
        <div id="input-buffer" class="input-history">0</div>
    </div>

    <!-- Numpad Grid -->
    <div class="numpad">
        <button class="btn-function" onclick="clearCalc()">AC</button>
        <button class="btn-function" onclick="appendOp('/')">÷</button>
        <button class="btn-function" onclick="appendOp('*')">×</button>
        <button class="btn-operator" onclick="appendOp('-')">−</button>

        <button class="btn-number" onclick="appendNum(7)">7</button>
        <button class="btn-number" onclick="appendNum(8)">8</button>
        <button class="btn-number" onclick="appendNum(9)">9</button>
        <button class="btn-operator" onclick="appendOp('+')">+</button>

        <button class="btn-number" onclick="appendNum(4)">4</button>
        <button class="btn-number" onclick="appendNum(5)">5</button>
        <button class="btn-number" onclick="appendNum(6)">6</button>
        <button class="btn-operator" onclick="calculate()">=</button>

        <button class="btn-number" onclick="appendNum(1)">1</button>
        <button class="btn-number" onclick="appendNum(2)">2</button>
        <button class="btn-number" onclick="appendNum(3)">3</button>
        <button class="btn-number btn-zero" onclick="appendNum(0)">0</button>
    </div>
</div>

<script>
    let currentInput = "";
    let lastCalculated = false;

    const bufferEl = document.getElementById('input-buffer');
    const workingEl = document.getElementById('working-area');

    function updateDisplay(val) {
        let displayVal = val.replace(/\*/g, '×').replace(/\//g, '÷');
        bufferEl.innerText = displayVal || "0";
    }

    function appendNum(num) {
        if (lastCalculated) {
            currentInput = "";
            lastCalculated = false;
            workingEl.style.display = "none";
        }
        if (currentInput === "0") currentInput = "";
        currentInput += num;
        updateDisplay(currentInput);
    }

    function appendOp(op) {
        if (lastCalculated) {
            lastCalculated = false;
            workingEl.style.display = "none";
        }
        if (currentInput === "" && op === "-") {
            currentInput = "-";
            updateDisplay(currentInput);
            return;
        }
        if (["+", "-", "*", "/"].includes(currentInput.slice(-1))) {
            currentInput = currentInput.slice(0, -1) + op;
        } else if (currentInput !== "") {
            currentInput += op;
        }
        updateDisplay(currentInput);
    }

    function clearCalc() {
        currentInput = "";
        lastCalculated = false;
        updateDisplay("0");
        workingEl.innerText = "";
        workingEl.style.display = "none";
    }

    function calculate() {
        if (!currentInput) return;

        // Cleaned up validation engine to split simple operations cleanly
        const match = currentInput.match(/^(\d+)([\+\-\*\/])(\d+)$/);

        if (match) {
            const num1 = parseInt(match[1]);
            const op = match[2];
            const num2 = parseInt(match[3]);

            if (op === '/' && num2 !== 0) {
                generateBusStopVisual(num1, num2);
            } else if (op === '+' || op === '-') {
                generateColumnVisual(num1, num2, op);
            } else {
                runStandardEval();
            }
        } else {
            runStandardEval();
        }
        lastCalculated = true;
    }

    function runStandardEval() {
        try {
            let sanitized = currentInput.replace(/[^0-9+\-*/().]/g, '');
            let result = Function('"use strict"; return (' + sanitized + ')')();
            updateDisplay(result.toString());
            workingEl.innerText = "Answer:\n" + result;
            workingEl.style.display = "block";
        } catch(e) {
            updateDisplay("Error");
        }
    }

    function generateColumnVisual(n1, n2, op) {
        const s1 = n1.toString();
        const s2 = n2.toString();
        const maxLen = Math.max(s1.length, s2.length);
        
        const pad1 = s1.padStart(maxLen, ' ');
        const pad2 = s2.padStart(maxLen, ' ');
        
        let ans = op === '+' ? n1 + n2 : n1 - n2;
        let ansStr = ans.toString().padStart(maxLen, ' ');
        
        let visual = `  ${pad1}\n${op} ${pad2}\n${'-'.repeat(maxLen + 2)}\n  ${ansStr}`;
        
        workingEl.innerText = visual;
        workingEl.style.display = "block";
        updateDisplay(ans.toString());
    }

    function generateBusStopVisual(dividend, divisor) {
        const divStr = dividend.toString();
        let currentRem = 0;
        let answerStr = "";

        for (let i = 0; i < divStr.length; i++) {
            let digit = parseInt(divStr[i]);
            let currentVal = currentRem * 10 + digit;
            let fits = Math.floor(currentVal / divisor);
            let nextRem = currentVal % divisor;
            answerStr += fits;
            currentRem = nextRem;
        }

        const finalAns = parseInt(answerStr) || 0;
        let padSpaces = divisor.toString().length + 2;
        
        let line1 = " ".repeat(padSpaces) + finalAns;
        let line2 = ` ${divisor} ┌${'-'.repeat(divStr.length + 1)}`;
        let line3 = " ".repeat(padSpaces) + divStr;
        
        let visual = `${line1}\n${line2}\n${line3}`;
        if (currentRem > 0) {
            visual += `\n\nRemainder: ${currentRem}`;
        }

        workingEl.innerText = visual;
        workingEl.style.display = "block";
        updateDisplay(finalAns.toString());
    }

// Dynamic manifest registration
const manifest = {
    "short_name": "Steps",
    "name": "Steps - Visual Math Calculator",
    "start_url": ".",
    "display": "fullscreen",
    "background_color": "#1c1c1e",
    "theme-color": "#1e1e24",
    "icons": [{
        "src": "https://cdn.jim-nielsen.com/ios/512/calculator-2020-02-06.png?rf=1024",
        "type": "image/png",
        "sizes": "512x512",
        "purpose": "any maskable"
    }]
};

const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
document.getElementById('pwa-manifest').setAttribute('href', URL.createObjectURL(manifestBlob));

if ('serviceWorker' in navigator) {
    const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting()); 
        self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.log(err));
}
